# One toolchain for developers, git hooks and CI: `mise install`, then `mise run check`.
min_version = "2026.10.4"

[settings]
experimental = true

# Secrets come from fnox (fnox.toml): a task gets only the keys it lists in `secrets`.
[secrets.fnox]

# hk's version must match the package:// import at the top of hk.pkl: bump both together.
[tools]
fnox = "1.46.0"
node = "26.13.0"
pitchfork = "2.33.0"
"github:agent-sh/agnix" = "0.60.3"
"aqua:google/osv-scanner" = "2.7.0"
jactionlint = "2.4.0"
"aqua:hadolint/hadolint" = "2.15.1"
rumdl = "0.3.2"
typos = "1.52.0"
lychee = "0.24.2"
"aqua:betterleaks/betterleaks" = "1.9.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"github:mokevnin/easement" = "0.4.7"
"go:github.com/scip-code/scip-go/cmd/scip-go" = "0.2.9"
"github:sbdchd/squawk" = "2.71.0"
"github:quarylabs/sqruff" = "0.44.0"
go = "1.27.3"
golangci-lint = "2.15.0"
hk = "2.11.0"
pkl = "0.32.2"
"aqua:sqlc-dev/sqlc" = "1.31.1"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.29.0"

# Local services, supervised by pitchfork (`mise daemons`). The postgres preset exports DATABASE_URL,
# keeps its data between runs and listens on 5433, so that it never meets a Postgres of your own on 5432.
[daemons.postgres]
preset = "postgres"
version = "18"
port = 5433
options.database = "crossmatch"

# Agent skills that the tools ship (hk, fnox, ...) are linked into .claude/skills and follow the pinned
# tool versions: `mise install` adds them and `mise upgrade` moves them. The vendored skills are separate:
# see skills:install and skills:update.
[settings.skills]
dir = ".claude/skills"
auto_sync = true
prune = true

[hooks]
postinstall = "hk install --mise"

[tasks.setup]
description = "Install the git hooks"
run = "hk install --mise"

[tasks.check]
description = "Run every check, the same set CI runs"
run = ["hk check --all", "go test -race ./..."]

[tasks."check:vulnerabilities"]
description = "Known vulnerabilities in every lockfile (the network; run by the nightly workflow)"
run = "osv-scanner scan source --recursive ."

[tasks."check:links"]
description = "Links to other sites in the Markdown (the network; run by the nightly workflow)"
run = "lychee --config lychee.toml --no-progress '**/*.md'"

[tasks.fix]
description = "Apply the automatic fixes"
run = "hk fix --all"

[tasks.generate]
description = "Regenerate internal/store (sqlc, from migrations and queries) and the message ids (from the Russian catalog)"
run = ["sqlc generate", "go run ./cmd/i18ngen"]

[tasks.run]
description = "Run the bot against the local database (started if needed); the Telegram credential comes from fnox"
daemons = "postgres"
secrets = ["BOT_TOKEN"]
run = "go run ./cmd/crossmatch"

[tasks.test]
description = "Run the Go tests with the race detector"
run = "go test -race ./..."

# The vendored skills (.agents/skills, linked from .claude/skills) come from skills-lock.json, through
# the skills CLI (https://github.com/vercel-labs/skills), pinned here.
[tasks."skills:install"]
description = "Restore the vendored agent skills from skills-lock.json and link the skills the tools ship"
run = ["npx --yes skills@1.7.6 experimental_install", "mise skills sync --prune"]

[tasks."skills:check"]
description = "Report the vendored agent skills that have an update upstream"
run = "npx --yes skills@1.7.6 check"

[tasks."skills:update"]
description = "Update the vendored agent skills (and skills-lock.json), then relink the tools' skills"
run = ["npx --yes skills@1.7.6 update", "mise skills sync --prune"]
