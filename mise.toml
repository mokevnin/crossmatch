# One toolchain for developers, git hooks and CI: `mise install`, then `mise run check`.
# hk's version must match the package:// import at the top of hk.pkl: bump both together.
[tools]
"github:agent-sh/agnix" = "0.60.3"
"aqua:google/osv-scanner" = "2.7.0"
jactionlint = "2.4.0"
"aqua:hadolint/hadolint" = "2.15.1"
rumdl = "0.3.2"
typos = "1.52.0"
lychee = "0.24.2"
"aqua:betterleaks/betterleaks" = "1.9.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"github:mokevnin/easement" = "0.4.7"
"go:github.com/scip-code/scip-go/cmd/scip-go" = "0.2.9"
"github:sbdchd/squawk" = "2.71.0"
"github:quarylabs/sqruff" = "0.44.0"
go = "1.27.3"
golangci-lint = "2.15.0"
hk = "2.11.0"
pkl = "0.32.2"
"aqua:sqlc-dev/sqlc" = "1.31.1"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.29.0"

[hooks]
postinstall = "hk install --mise"

[tasks.setup]
description = "Install the git hooks"
run = "hk install --mise"

[tasks.check]
description = "Run every check, the same set CI runs"
run = ["hk check --all", "go test ./..."]

[tasks."check:vulnerabilities"]
description = "Known vulnerabilities in every lockfile (the network; run by the nightly workflow)"
run = "osv-scanner scan source --recursive ."

[tasks."check:links"]
description = "Links to other sites in the Markdown (the network; run by the nightly workflow)"
run = "lychee --config lychee.toml --no-progress '**/*.md'"

[tasks.fix]
description = "Apply the automatic fixes"
run = "hk fix --all"

[tasks.generate]
description = "Regenerate the code sqlc writes from migrations and queries"
run = "sqlc generate"

[tasks.test]
description = "Run the Go tests"
run = "go test ./..."
