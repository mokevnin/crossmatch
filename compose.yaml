services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crossmatch
      POSTGRES_PASSWORD: crossmatch
      POSTGRES_DB: crossmatch
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossmatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
