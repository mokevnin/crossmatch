# Architecture gate (https://github.com/mokevnin/easement): `mise run check`.
# A violation names the rule's `because`; read it before reaching for a baseline entry.
version: 1

components:
  # The program: wires the packages together and talks to Telegram and the database.
  cmd: { in: cmd/crossmatch }
  # The matching rules: pure functions over plain values.
  matching: { in: internal/matching }
  # The code sqlc writes from migrations/ and queries/.
  store: { in: internal/store }

# Tests drive whole programs, so they are not part of a component's own layer.
exclude: ['**/*_test.go', '**/testdata/**']

# Generated code stays in the graph as a target, but its own imports are not checked.
target_only: ['internal/store/**']

rules:
  cmd:
    may_depend_on: [matching, store]
    because: cmd is where the program is assembled
  matching:
    may_depend_on: []
    forbid_external:
      - name: github.com/jackc/pgx/v5
        because: the matching rules take and return plain values; reading the database is the store's job
    because: matching is pure and imports no other package of ours, so a rule is testable without a database
  store:
    may_depend_on: []
    because: store is generated by sqlc from SQL and knows nothing about the rest of the program
