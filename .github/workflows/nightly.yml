name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Vulnerability databases change without a commit, so this runs on a schedule too.
      - name: Vulnerabilities
        run: mise run check:vulnerabilities

      # Links to other sites break without a commit as well.
      - name: Links
        run: mise run check:links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
