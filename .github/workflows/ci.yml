name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Read-only: the checks lint and test, and publish nothing.
permissions:
  contents: read

# A new push cancels the older runs of the same pull request (or of main) only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: betterleaks scans every commit, and a shallow checkout would hand it one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installs mise and every tool pinned in mise.toml, and caches them.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same command a developer runs: the hk checks and the Go tests.
      - name: Check
        run: mise run check
